<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Field</title>
<meta name="description" content="The Field — coming soon.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23362706'/%3E%3Crect x='30' y='30' width='40' height='40' fill='%23D6622C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Source+Serif+Pro:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #E9E5D6;
    --marigold: #D6622C;
    --marigold-dark: #b8541f;
    --dark: #362706;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    font-family: "Source Serif Pro", Georgia, serif;
    background: var(--dark);
  }

  .hero {
    position: relative;
    height: 100vh;
    min-height: 100svh;
    width: 100%;
    background-image: url("images/hero.jpg");
    background-size: cover;
    background-position: center 65%;
    background-color: var(--dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 15vh;
    text-align: center;
    overflow: hidden;
  }

  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(20, 14, 2, 0) 0%,
      rgba(20, 14, 2, 0.1) 40%,
      rgba(20, 14, 2, 0.78) 100%
    );
    pointer-events: none;
  }

  .hero-content {
    position: relative;
    z-index: 1;
    padding: 0 24px;
    max-width: 640px;
  }

  h1 {
    font-family: "Instrument Serif", Georgia, serif;
    font-weight: 400;
    color: var(--cream);
    font-size: clamp(3rem, 10vw, 6.2rem);
    letter-spacing: 0;
    line-height: 1;
    margin: 0 0 18px;
    text-shadow: 0 4px 26px rgba(0, 0, 0, 0.5);
  }

  .subhead {
    position: relative;
    top: 20px;
    font-family: "Source Serif Pro", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    color: var(--cream);
    font-size: clamp(1.15rem, 3vw, 1.6rem);
    margin: 0 0 38px;
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.45);
  }

  .cta {
    display: inline-block;
    background: var(--marigold);
    color: var(--cream);
    text-decoration: none;
    font-family: "Source Serif Pro", Georgia, serif;
    font-weight: 600;
    font-size: 1.05rem;
    padding: 15px 42px;
    border-radius: 2px;
    letter-spacing: 0.03em;
    transition: background 0.15s ease;
  }

  .cta:hover {
    background: var(--marigold-dark);
  }
</style>
</head>
<body>

<section class="hero">
  <div class="hero-content">
    <h1>The Field</h1>
    <p class="subhead">Are you ready to play?</p>
    <a class="cta" href="mailto:fieldparadox@icloud.com">Contact Us</a>
  </div>
</section>

</body>
</html>
